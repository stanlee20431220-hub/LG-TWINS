name: Baseball Stock Monitoring

on:
  schedule:
    - cron: "15 0 * * *"  # 매일 한국 시간 09:15 (GitHub 예약 실행은 지연될 수 있음)
  workflow_dispatch:
    inputs:
      stock_team:
        description: "재고 조회 구단 (예약 실행은 전체 구단)"
        required: true
        default: "전체"
        type: choice
        options:
          - "전체"
          - "LG트윈스"
          - "두산베어스"
          - "키움히어로즈"
      browser_stock_evidence:
        description: "Optional fresh verified browser API evidence JSON (10-minute validity)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: lg-twins-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Validate code
        run: |
          python -m py_compile scripts/check_stock.py scripts/sheets_sync.py
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          BROWSER_STOCK_EVIDENCE_JSON: ${{ inputs.browser_stock_evidence || '' }}
          INPUT_STOCK_TEAM: ${{ inputs.stock_team || '전체' }}
        run: |
          failed=0
          case "$INPUT_STOCK_TEAM" in
            전체) teams=(LG트윈스 두산베어스 키움히어로즈) ;;
            LG트윈스|두산베어스|키움히어로즈) teams=("$INPUT_STOCK_TEAM") ;;
            *) echo "Invalid stock_team" >&2; exit 1 ;;
          esac
          for team in "${teams[@]}"; do
            echo "=== ${team} 재고 조회 ==="
            STOCK_TEAM="$team" python scripts/check_stock.py || failed=1
          done
          exit "$failed"
      - name: Commit updated history
        if: always()
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@github.com"
          git add data/stock_history*.json
          git diff --quiet --cached || git commit -m "재고 기록 업데이트 [skip ci]"
          git push
